<!doctype html><html><head><meta charset="utf-8"></head><body>
<a href="/elsewhere" class="skip-link">Skip to content</a>
<div style="height:200px"></div>
<div class="player" style="position:relative;width:640px;height:360px;background:#000">
  <video></video>
  <button id="intro" class="skip-intro">Skip intro</button>
  <button id="countdown" class="ad-skip">Skip in 5</button>
  <div class="ima-ad-container" style="position:absolute;inset:0">
    <iframe src="http://ads.example:8001/adframe.html" style="width:100%;height:100%;border:0"></iframe>
  </div>
</div>
<script>
window.result="waiting"; window.decoys=[];
for (const id of ["intro","countdown"]) document.getElementById(id).onclick=()=>decoys.push(id);
document.querySelector(".skip-link").onclick=(e)=>{e.preventDefault();decoys.push("skip-to-content")};
addEventListener("message",e=>{if(e.data&&e.data.testResult)window.result=e.data.testResult});
</script></body></html>
