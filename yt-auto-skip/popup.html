<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .count { margin-top: 12px; font-size: 13px; color: #555; }
    .count b { color: #111; font-size: 16px; }
    button { margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>YouTube Auto Skip</h1>
  <label>
    Auto-skip enabled
    <input type="checkbox" id="enabled" />
  </label>
  <div class="count">Ads skipped: <b id="count">0</b></div>
  <button id="reset">Reset counter</button>
  <script src="popup.js"></script>
</body>
</html>
